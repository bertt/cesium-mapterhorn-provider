<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cesium + Mapterhorn terrain</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.146/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.146/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <script src="dist/cesium-mapterhorn-provider.min.js"></script>
  <style>
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; }
    #controls {
      position: absolute; top: 10px; left: 10px; z-index: 1;
      background: rgba(30, 30, 30, 0.8); color: #fff; font: 14px sans-serif;
      padding: 8px 12px; border-radius: 4px;
    }
    #controls h1 { font-size: 16px; margin: 0 0 8px; }
    #controls input { vertical-align: middle; width: 180px; }
    #controls #tileUrl { width: 330px; }
    #controls > div { margin-bottom: 8px; }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="controls">
    <h1>Mapterhorn terrain in CesiumJS</h1>
    <div>
      <label for="tileUrl">Tile URL:</label><br />
      <input id="tileUrl" type="text" value="https://tiles.mapterhorn.com/{z}/{x}/{y}.webp" />
      <button id="applyUrl">Apply</button>
    </div>
    <label for="exaggeration">Terrain exaggeration:</label>
    <input id="exaggeration" type="range" min="1" max="10" step="0.1" value="1" />
    <span id="exaggerationValue">1.0x</span>
  </div>
  <script>
    const viewer = new Cesium.Viewer("cesiumContainer", {
      baseLayer: new Cesium.ImageryLayer(new Cesium.OpenStreetMapImageryProvider({
        url: "https://tile.openstreetmap.org/",
      })),
      terrainProvider: new CesiumMapterhorn.MapterhornTerrainProvider({
        url: document.getElementById("tileUrl").value,
      }),
      baseLayerPicker: false,
      geocoder: false,
      homeButton: false,
      sceneModePicker: false,
      navigationHelpButton: false,
      animation: false,
      timeline: false,
      fullscreenButton: false,
      infoBox: false,
      selectionIndicator: false,
    });

    document.getElementById("applyUrl").addEventListener("click", () => {
      viewer.scene.terrainProvider = new CesiumMapterhorn.MapterhornTerrainProvider({
        url: document.getElementById("tileUrl").value.trim(),
      });
    });
    viewer.scene.globe.depthTestAgainstTerrain = true;

    const slider = document.getElementById("exaggeration");
    const label = document.getElementById("exaggerationValue");
    slider.addEventListener("input", () => {
      const value = parseFloat(slider.value);
      viewer.scene.verticalExaggeration = value;
      label.textContent = value.toFixed(1) + "x";
    });

    // Matterhorn
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(7.62, 45.93, 6500),
      orientation: { heading: Cesium.Math.toRadians(20), pitch: Cesium.Math.toRadians(-20) },
    });
  </script>
</body>
</html>
